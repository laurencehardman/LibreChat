# Run: docker compose up --build -d
# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-panel:
    image: ghcr.io/clickhouse/librechat-admin-panel:latest
    ports:
      - 3000:3000
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: .env
    environment:
      - PORT=3000

  litellm:
    build: ./litellm-patch
    ports:
      - "4000:4000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./litellm/pragmagpt_prompt.py:/app/pragmagpt_prompt.py:ro
      - ./prompts:/app/prompts:ro
    command: ["--config=/app/config.yaml", "--port", "4000", "--detailed_debug"]

  mcp-fetch:
    build: ./mcp-fetch
    container_name: mcp-fetch
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "--pass-environment"
      - "--port=3100"
      - "--host=0.0.0.0"
      - "--allow-origin=*"
      - "--"
      - "uvx"
      - "mcp-server-fetch"
      - "--user-agent=PragmaGPT/1.0 (+https://lekkervpn.co.za)"
      - "--ignore-robots-txt"

  firecrawl-redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2", compress: "true" }
    restart: unless-stopped

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2", compress: "true" }
    restart: unless-stopped

  firecrawl-playwright:
    build: ./firecrawl/apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${FIRE_PROXY_SERVER:-}
      PROXY_USERNAME: ${FIRE_PROXY_USERNAME:-}
      PROXY_PASSWORD: ${FIRE_PROXY_PASSWORD:-}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-false}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3", compress: "true" }
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    restart: unless-stopped

  firecrawl-api:
    build: ./firecrawl/apps/api
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: ${FIRECRAWL_PORT:-3002}
      INTERNAL_PORT: ${FIRECRAWL_PORT:-3002}
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${POSTGRES_DB:-firecrawl}
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      USE_DB_AUTHENTICATION: false
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
      OPENAI_API_KEY: ""
    depends_on:
      firecrawl-redis: { condition: service_started }
      firecrawl-playwright: { condition: service_started }
      firecrawl-rabbitmq: { condition: service_healthy }
    ports:
      - "${FIRECRAWL_PORT:-3002}:${FIRECRAWL_PORT:-3002}"
    command: node dist/src/harness.js --start-docker
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3", compress: "true" }
    restart: unless-stopped

  firecrawl-postgres:
    build: ./firecrawl/apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${POSTGRES_DB:-firecrawl}
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3", compress: "true" }
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "cron.database_name=firecrawl"
    env_file:
      - .env

volumes:
  pgdata2:
